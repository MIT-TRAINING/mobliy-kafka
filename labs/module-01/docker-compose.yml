# Module 1 lab environment: a single Apache Kafka node in KRaft mode.
# The node is both broker and controller (combined mode). That is fine for
# local labs, never for production. Multi-broker clusters come in Module 2.
#
#   Start:   docker compose up -d
#   Stop:    docker compose down        (keeps data in the named volume)
#   Reset:   docker compose down -v     (deletes all topics and data)

services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      # --- KRaft identity and roles ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

      # --- Listeners ---
      # PLAINTEXT      : clients inside the container / Docker network
      # CONTROLLER     : KRaft controller traffic
      # PLAINTEXT_HOST : clients on your laptop (localhost:9092)
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # --- Single-node settings (internal topics cannot have RF > 1 here) ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1

      # --- Storage ---
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Check for expired segments every 15 s (default 5 min) so Lab 03 is quick
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 15000

      # --- Lab convenience (not Kafka settings) ---
      # Put the CLI tools on PATH and define $BS for every `docker exec` shell
      PATH: /opt/kafka/bin:/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      BS: localhost:9092
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

volumes:
  kafka-data:
