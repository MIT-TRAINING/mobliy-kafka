# Module 4 local lab environment: a 3-broker Kafka cluster managed by ZooKeeper,
# plus Kafka UI to watch topics, consumer groups and lag in a browser.
#
#   Start:   docker compose up -d
#   Stop:    docker compose down        (keeps data in the named volumes)
#   Reset:   docker compose down -v     (deletes all topics and data)
#   Web UI:  http://localhost:8080
#
# Why Kafka 3.9: Apache Kafka 4.x removed ZooKeeper mode entirely, so
# apache/kafka:4.x can only run KRaft. 3.9 is the last Apache Kafka release line
# that still supports ZooKeeper. ZooKeeper itself is the official Apache image.
# Leaving KAFKA_PROCESS_ROLES unset is what puts the broker in ZooKeeper mode.
#
# The apache/kafka image is built for KRaft: its start script always runs
# "kafka-storage.sh format", which refuses a ZooKeeper-mode config. So each broker
# runs its own short start command (x-kafka-common below): build server.properties
# from the KAFKA_* variables as usual, skip the format, start the broker.
# ZooKeeper-mode brokers need no format step and no CLUSTER_ID: the cluster ID is
# generated by the first broker and stored in ZooKeeper (/cluster/id).
#
# Listeners on every broker:
#   PLAINTEXT  :29092  brokers, Kafka UI and `docker exec` shells (kafka-N:29092)
#   EXTERNAL   : 9092  your laptop; published as localhost:9092 / 9093 / 9094
#                      (matches spring-boot-kafka-producer / -consumer)
#
# In ZooKeeper mode there is no CONTROLLER listener: one broker is elected
# controller through ZooKeeper (see the /controller znode), and broker
# registrations, topic metadata and ACLs live in ZooKeeper.

# Settings that are identical on all three brokers. Each service merges this map
# into its own environment with "<<: *kafka-common-env".
x-kafka-common-env: &kafka-common-env
  KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
  KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

  # Cluster-wide defaults. With 3 brokers the internal topics can be RF 3.
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  # Topics must be created on purpose by an administrator
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  KAFKA_LOG_DIRS: /var/lib/kafka/data
  # Three JVMs on one laptop: keep each heap small
  KAFKA_HEAP_OPTS: -Xms512m -Xmx512m

  # --- Lab convenience (not Kafka settings) ---
  # CLI tools on PATH, and $BS = the internal bootstrap list for `docker exec` shells
  PATH: /opt/kafka/bin:/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  BS: kafka-1:29092,kafka-2:29092,kafka-3:29092

x-kafka-common: &kafka-common
  image: apache/kafka:3.9.2
  networks: [kafka-net]
  # 1. Turn the KAFKA_* variables into /opt/kafka/config/server.properties
  #    (this is the image's own tool; its KRaft format step fails and is ignored)
  # 2. Stop if no config was written, otherwise start the broker in ZooKeeper mode
  command:
    - bash
    - -c
    - |
      kafka-run-class.sh kafka.docker.KafkaDockerWrapper setup \
        --default-configs-dir /etc/kafka/docker \
        --mounted-configs-dir /mnt/shared/config \
        --final-configs-dir /opt/kafka/config > /dev/null 2>&1
      grep -q '^zookeeper.connect=' /opt/kafka/config/server.properties || exit 1
      exec kafka-server-start.sh /opt/kafka/config/server.properties
  depends_on:
    zookeeper:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 12
    start_period: 20s

services:
  # A single ZooKeeper node is enough for a laptop. Production runs an ensemble
  # of 3 or 5 so that a majority survives the loss of a node.
  zookeeper:
    image: zookeeper:3.8.5
    container_name: zookeeper
    hostname: zookeeper
    networks: [kafka-net]
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_TICK_TIME: 2000
      # Allow the "ruok" / "srvr" / "mntr" four-letter-word health commands
      ZOO_4LW_COMMANDS_WHITELIST: ruok,srvr,stat,mntr,conf
      JVMFLAGS: -Xms256m -Xmx256m
    volumes:
      - zookeeper-data:/data
      - zookeeper-log:/datalog
    healthcheck:
      test: ["CMD-SHELL", "zkServer.sh status > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 10s

  kafka-1:
    <<: *kafka-common
    container_name: kafka-1
    hostname: kafka-1
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-common-env
      KAFKA_BROKER_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,EXTERNAL://localhost:9092
    volumes:
      - kafka-1-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka-common
    container_name: kafka-2
    hostname: kafka-2
    ports:
      - "9093:9092"
    environment:
      <<: *kafka-common-env
      KAFKA_BROKER_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29092,EXTERNAL://localhost:9093
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka-common
    container_name: kafka-3
    hostname: kafka-3
    ports:
      - "9094:9092"
    environment:
      <<: *kafka-common-env
      KAFKA_BROKER_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:29092,EXTERNAL://localhost:9094
    volumes:
      - kafka-3-data:/var/lib/kafka/data

  # Web UI for the cluster: brokers, topics, messages, consumer groups and lag.
  # It connects over the internal PLAINTEXT listener, like any other container.
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    hostname: kafka-ui
    networks: [kafka-net]
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: module-04-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      # Lets you add or edit clusters from the UI (Settings > Configure)
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

networks:
  kafka-net:
    name: kafka-net

volumes:
  zookeeper-data:
  zookeeper-log:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
