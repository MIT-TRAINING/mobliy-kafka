# Module 2 lab environment: a 3-node Apache Kafka cluster in KRaft mode.
# Every node is broker + controller (combined mode), like the official
# quickstart for small clusters. Production splits the two roles (Module 5).
#
#   Start:   docker compose up -d
#   Stop:    docker compose down        (keeps data in the named volumes)
#   Reset:   docker compose down -v     (deletes all topics and data)
#
# Every node is formatted with the same cluster ID. A sample ID is built in;
# Lab 01 has you put your own in a .env file next to this one (CLUSTER_ID=...),
# which Docker Compose reads automatically.
#
# Listeners on every node:
#   PLAINTEXT  :29092  brokers and containers on the Docker network (kafka-N:29092)
#   CONTROLLER : 9093  KRaft controller (Raft) traffic, never used by clients
#   EXTERNAL   : 9092  your laptop; published as localhost:9092 / 9094 / 9096

# Settings that are identical on all three nodes. Each service merges this map
# into its own environment with "<<: *kafka-common-env".
x-kafka-common-env: &kafka-common-env
  CLUSTER_ID: ${CLUSTER_ID:-Je89w39_Q46DWmFYXCGkGw}
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

  # Cluster-wide defaults. With 3 brokers the internal topics can be RF 3.
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  # Topics must be created on purpose by an administrator (Lab 02)
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  KAFKA_LOG_DIRS: /var/lib/kafka/data
  # Three JVMs on one laptop: keep each heap small
  KAFKA_HEAP_OPTS: -Xms512m -Xmx512m

  # --- Lab convenience (not Kafka settings) ---
  # CLI tools on PATH, and $BS = the internal bootstrap list for `docker exec` shells
  PATH: /opt/kafka/bin:/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  BS: kafka-1:29092,kafka-2:29092,kafka-3:29092

x-kafka-common: &kafka-common
  image: apache/kafka:4.3.1
  networks: [kafka-net]
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 12
    start_period: 20s

services:
  kafka-1:
    <<: *kafka-common
    container_name: kafka-1
    hostname: kafka-1
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,EXTERNAL://localhost:9092
    volumes:
      - kafka-1-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka-common
    container_name: kafka-2
    hostname: kafka-2
    ports:
      - "9094:9092"
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29092,EXTERNAL://localhost:9094
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka-common
    container_name: kafka-3
    hostname: kafka-3
    ports:
      - "9096:9092"
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:29092,EXTERNAL://localhost:9096
    volumes:
      - kafka-3-data:/var/lib/kafka/data

networks:
  kafka-net:
    name: kafka-net

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
