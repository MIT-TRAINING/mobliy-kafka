spring.application.name=kafka-avro-service
server.port=7073

spring.kafka.bootstrap-servers=localhost:9092

# Module 6 Lab 06
# Kafka client file: ~/kafka/ccloud.properties (Cloud) or ~/kafka/cp.properties (Platform)
app.kafka.client-config=${KAFKA_CLIENT_CONFIG:}
# Schema Registry client file: ~/kafka/sr-ccloud.properties or ~/kafka/sr-cp.properties
app.sr.client-config=${SR_CLIENT_CONFIG:}
app.prefix=${ME:local}
app.topic=${app.prefix}.cdr.voice.avro
# Which schema the producer writes with: v1, v2 or v3-breaking (src/main/resources/avro/)
app.schema=${SCHEMA:v1}
