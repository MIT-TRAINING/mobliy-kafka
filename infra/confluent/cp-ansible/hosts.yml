# cp-ansible inventory for the shared Confluent Platform 8.x cluster used in Modules 6-10
# (infra/LAB-SETUP.md §5): 3 KRaft controllers, 3 Confluent Server brokers, 1 services node.
#
# - TLS everywhere with the course CA from ../scripts/make-certs.sh
# - RBAC through MDS, users from OpenLDAP (../scripts/gen-ldap-users.sh)
# - Learners connect on CLIENT :9092 with SASL_SSL/PLAIN, checked against LDAP
# - Secrets come from environment variables (see infra/confluent/README.md Part B.5), never from this file
#
# Hosts come from ../terraform (8 x Ubuntu 24.04, no SSH port). Terraform also writes
# ../secrets/ansible-ssm.yml: instance IDs, SSH-over-SSM proxy, key and secrets path.
# Install (README Part B.5):
#   ansible-playbook -i hosts.yml -i ../secrets/ansible-ssm.yml ldap.yml
#   ansible-playbook -i hosts.yml -i ../secrets/ansible-ssm.yml confluent.platform.all
# Checked against the sample inventories of cp-ansible 8.3.2; variable names change between
# major versions.

all:
  vars:
    ansible_connection: ssh
    ansible_become: true
    # ansible_user, ansible_ssh_private_key_file, ansible_ssh_common_args (SSM proxy) and
    # cp_secrets_dir come from ../secrets/ansible-ssm.yml

    # --- Version -----------------------------------------------------------
    confluent_package_version: "8.3.2"      # match the collection version

    # --- TLS: bring the course CA and per-host certificates ---------------
    ssl_enabled: true
    ssl_custom_certs: true
    ssl_ca_cert_filepath: "{{ cp_secrets_dir }}/certs/ca.pem"
    ssl_signed_cert_filepath: "{{ cp_secrets_dir }}/certs/{{ inventory_hostname }}.pem"
    ssl_key_filepath: "{{ cp_secrets_dir }}/certs/{{ inventory_hostname }}-key.pem"

    # --- Server-to-server authentication -------------------------------------
    # RBAC needs an authenticated principal for every controller and broker: they prove
    # themselves with their host certificate (mTLS) on the KRaft and BROKER listeners only.
    # Learner and component listeners keep server-side TLS.
    kafka_controller_ssl_mutual_auth_enabled: true
    kafka_controller_ssl_client_authentication: required

    # --- RBAC with MDS + LDAP ---------------------------------------------
    rbac_enabled: true
    mds_super_user: mds
    mds_super_user_password: "{{ lookup('env', 'CP_MDS_PASSWORD') }}"
    kafka_broker_ldap_user: kafka_broker
    kafka_broker_ldap_password: "{{ lookup('env', 'CP_BROKER_LDAP_PASSWORD') }}"
    schema_registry_ldap_user: schema_registry
    schema_registry_ldap_password: "{{ lookup('env', 'CP_SR_LDAP_PASSWORD') }}"
    kafka_connect_ldap_user: connect_worker
    kafka_connect_ldap_password: "{{ lookup('env', 'CP_CONNECT_LDAP_PASSWORD') }}"
    ksql_ldap_user: ksql
    ksql_ldap_password: "{{ lookup('env', 'CP_KSQL_LDAP_PASSWORD') }}"
    control_center_next_gen_ldap_user: control_center
    control_center_next_gen_ldap_password: "{{ lookup('env', 'CP_C3_LDAP_PASSWORD') }}"

    # --- Listeners ----------------------------------------------------------
    # broker/internal keep their dictionary keys (cp-ansible requirement).
    # internal moves to 9071 so that the documented learner bootstrap stays :9092.
    kafka_broker_custom_listeners:
      broker:
        name: BROKER
        port: 9091
        ssl_mutual_auth_enabled: true
        ssl_client_authentication: required
      internal:
        name: INTERNAL
        port: 9071
      client:
        name: CLIENT
        port: 9092
        ssl_enabled: true
        sasl_protocol: plain

    # --- Licence --------------------------------------------------------------
    # Leave CONFLUENT_LICENSE empty for the built-in 30-day trial.
    # For a subscription, export the key and uncomment the confluent.license lines below
    # (brokers, Schema Registry, Connect, ksqlDB, Control Center).

    kafka_broker_custom_properties:
      # confluent.license: "{{ lookup('env', 'CONFLUENT_LICENSE') }}"
      # Learner passwords on the CLIENT listener are checked against LDAP
      listener.name.client.plain.sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required;
      listener.name.client.plain.sasl.server.callback.handler.class: io.confluent.security.auth.provider.ldap.LdapAuthenticateCallbackHandler
      ldap.java.naming.factory.initial: com.sun.jndi.ldap.LdapCtxFactory
      ldap.java.naming.provider.url: ldap://cp-ldap.lab.internal:389
      ldap.java.naming.security.principal: uid=mds,ou=people,dc=lab,dc=internal
      ldap.java.naming.security.credentials: "{{ lookup('env', 'CP_MDS_PASSWORD') }}"
      ldap.java.naming.security.authentication: simple
      ldap.user.search.base: ou=people,dc=lab,dc=internal
      ldap.user.name.attribute: uid
      ldap.user.object.class: inetOrgPerson
      ldap.group.search.base: ou=groups,dc=lab,dc=internal
      ldap.group.name.attribute: cn
      ldap.group.object.class: groupOfNames
      ldap.group.member.attribute: member
      ldap.group.member.attribute.pattern: uid=(.*),ou=people,dc=lab,dc=internal
      # Course guardrails (same as the shared Apache cluster)
      auto.create.topics.enable: "false"
      default.replication.factor: "3"
      min.insync.replicas: "2"
      unclean.leader.election.enable: "false"
      # Self-Balancing Clusters (guide §3.1); set to "false" for a fully static demo
      confluent.balancer.enable: "true"

    # --- Memory: sized for t3a.medium controllers (4 GB) and t3a.large brokers/services (8 GB) ---
    # cp-ansible refuses hosts below these totals (defaults 7000 MB for controller, broker, C3).
    required_total_memory_mb_kafka_controller: 3500
    required_total_memory_mb_kafka_broker: 7000
    required_total_memory_mb_control_center_next_gen: 7000
    # The heap lives in each role's environment dictionary, so every dictionary is repeated here
    # in full (role defaults of cp-ansible 8.3.2) with only the *_HEAP_OPTS value changed.
    kafka_controller_service_environment_overrides:
      JAVA_HOME: "{{ custom_java_path | default('') }}"
      KAFKA_HEAP_OPTS: "-Xms1g -Xmx1536m -XX:MetaspaceSize=96m -XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:InitiatingHeapOccupancyPercent=35 -XX:G1HeapRegionSize=16M -XX:MinMetaspaceFreeRatio=50 -XX:MaxMetaspaceFreeRatio=80"
      KAFKA_OPTS: "{{ kafka_controller_final_java_args | confluent.platform.java_arg_build_out }}"
      KAFKA_LOG4J_OPTS: "{% if kafka_controller_custom_log4j2|bool %}-Dlog4j2.configurationFile=file:{{ kafka_controller.log4j_file }}{% endif %}"
      LOG_DIR: "{{ kafka_controller_log_dir|regex_replace('\\/$', '') }}"
      CONFLUENT_SECURITY_MASTER_KEY: "{% if kafka_controller_secrets_protection_enabled|bool %}{{secrets_protection_masterkey}}{% endif %}"
    kafka_broker_service_environment_overrides:
      JAVA_HOME: "{{ custom_java_path | default('') }}"
      KAFKA_HEAP_OPTS: "-Xms3g -Xmx3g -XX:MetaspaceSize=96m -XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:InitiatingHeapOccupancyPercent=35 -XX:G1HeapRegionSize=16M -XX:MinMetaspaceFreeRatio=50 -XX:MaxMetaspaceFreeRatio=80"
      KAFKA_OPTS: "{{ kafka_broker_final_java_args | confluent.platform.java_arg_build_out }}"
      KAFKA_LOG4J_OPTS: "{% if kafka_broker_custom_log4j2|bool %}-Dlog4j2.configurationFile=file:{{ kafka_broker.log4j_file }}{% endif %}"
      LOG_DIR: "{{ kafka_broker_log_dir|regex_replace('\\/$', '') }}"
      CONFLUENT_SECURITY_MASTER_KEY: "{% if kafka_broker_secrets_protection_enabled|bool %}{{secrets_protection_masterkey}}{% endif %}"
    # cp-services (8 GB + 4 GB swap): SR 512 MB + Connect 1 GB + ksqlDB 1 GB + C3 2 GB, plus C3's Prometheus/Alertmanager
    schema_registry_service_environment_overrides:
      JAVA_HOME: "{{ custom_java_path | default('') }}"
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xms512m -Xmx512m -XX:MetaspaceSize=96m -XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:InitiatingHeapOccupancyPercent=35 -XX:G1HeapRegionSize=16M -XX:MinMetaspaceFreeRatio=50 -XX:MaxMetaspaceFreeRatio=80"
      SCHEMA_REGISTRY_OPTS: "{{ schema_registry_final_java_args | confluent.platform.java_arg_build_out }}"
      SCHEMA_REGISTRY_LOG4J_OPTS: "{% if schema_registry_custom_log4j2|bool %}-Dlog4j2.configurationFile=file:{{ schema_registry.log4j_file }}{% endif %}"
      LOG_DIR: "{{ schema_registry_log_dir|regex_replace('\\/$', '') }}"
      CONFLUENT_SECURITY_MASTER_KEY: "{% if schema_registry_secrets_protection_enabled|bool %}{{secrets_protection_masterkey}}{% endif %}"
    kafka_connect_service_environment_overrides:
      JAVA_HOME: "{{ custom_java_path | default('') }}"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx1g"
      KAFKA_OPTS: "{{ kafka_connect_final_java_args | confluent.platform.java_arg_build_out }}"
      KAFKA_LOG4J_OPTS: "{% if kafka_connect_custom_log4j2|bool %}-Dlog4j2.configurationFile=file:{{ kafka_connect.log4j_file }}{% endif %}"
      LOG_DIR: "{{ kafka_connect_log_dir|regex_replace('\\/$', '') }}"
      CONFLUENT_SECURITY_MASTER_KEY: "{% if kafka_connect_secrets_protection_enabled|bool %}{{secrets_protection_masterkey}}{% endif %}"
    ksql_service_environment_overrides:
      JAVA_HOME: "{{ custom_java_path | default('') }}"
      KSQL_HEAP_OPTS: "-Xmx1g"
      KSQL_OPTS: "{{ ksql_final_java_args | confluent.platform.java_arg_build_out }}"
      KSQL_LOG4J_OPTS: "{% if ksql_custom_log4j2|bool %}-Dlog4j2.configurationFile=file:{{ ksql.log4j_file }}{% endif %}"
      LOG_DIR: "{{ ksql_log_dir|regex_replace('\\/$', '') }}"
      CONFLUENT_SECURITY_MASTER_KEY: "{% if ksql_secrets_protection_enabled|bool %}{{secrets_protection_masterkey}}{% endif %}"
      ROCKSDB_SHAREDLIB_DIR: "{{ksql_rocksdb_path}}"
    control_center_next_gen_service_environment_overrides:
      ROCKSDB_SHAREDLIB_DIR: "{{control_center_next_gen_rocksdb_path}}"
      CONTROL_CENTER_HEAP_OPTS: "-Xmx2g"
      CONTROL_CENTER_OPTS: "{{ control_center_next_gen_final_java_args | confluent.platform.java_arg_build_out }}"
      CONTROL_CENTER_LOG4J_OPTS: "{% if control_center_next_gen_custom_log4j2|bool %}-Dlog4j2.configurationFile=file:{{control_center_next_gen.log4j_file}}{% endif %}"
      LOG_DIR: "{{ control_center_next_gen_log_dir|regex_replace('\\/$', '') }}"
      CONFLUENT_SECURITY_MASTER_KEY: "{% if control_center_next_gen_secrets_protection_enabled|bool %}{{secrets_protection_masterkey}}{% endif %}"

    # schema_registry_custom_properties:
    #   confluent.license: "{{ lookup('env', 'CONFLUENT_LICENSE') }}"
    # kafka_connect_custom_properties:
    #   confluent.license: "{{ lookup('env', 'CONFLUENT_LICENSE') }}"
    # ksql_custom_properties:
    #   confluent.license: "{{ lookup('env', 'CONFLUENT_LICENSE') }}"
    # control_center_next_gen_custom_properties:
    #   confluent.license: "{{ lookup('env', 'CONFLUENT_LICENSE') }}"

  hosts:
    # cp-ansible runs certificate checks delegated to the admin laptop: no SSM proxy, no sudo there
    localhost:
      ansible_connection: local
      ansible_become: false
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

kafka_controller:
  hosts:
    cp-ctl-1.lab.internal:
    cp-ctl-2.lab.internal:
    cp-ctl-3.lab.internal:

kafka_broker:
  hosts:
    cp-broker-1.lab.internal:
    cp-broker-2.lab.internal:
    cp-broker-3.lab.internal:

schema_registry:
  hosts:
    cp-services.lab.internal:

kafka_connect:
  hosts:
    cp-services.lab.internal:

ksql:
  hosts:
    cp-services.lab.internal:

control_center_next_gen:
  hosts:
    cp-services.lab.internal:

# Not a cp-ansible group: OpenLDAP host for ldap.yml
ldap:
  hosts:
    cp-ldap.lab.internal:
